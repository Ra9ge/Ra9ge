<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14">
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" fill-opacity=".38"/></pattern>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.1" fill="#8f0000"/></pattern>
<style>
.s{font-family:EvaMincho,'Times New Roman',Times,'Liberation Serif','Nimbus Roman No9 L','DejaVu Serif',serif;font-weight:700;fill:#f3efe6}
.j{font-family:EvaMincho,'Yu Mincho',YuMincho,'Hiragino Mincho ProN','MS Mincho','Noto Serif JP','Noto Serif CJK JP',serif;font-weight:800;fill:#0a0a0a}
.m{font-family:Consolas,'SF Mono',Menlo,'DejaVu Sans Mono','Liberation Mono',monospace;font-size:15px;fill:#8a8a8a}
.w{fill:#f3efe6}.r{fill:#e10600}.k{fill:#0a0a0a}
.bl{animation:bl 1.2s steps(1,end) infinite}
@keyframes bl{50%{opacity:0}}
</style></defs>
<rect width="1200" height="14" fill="#0a0a0a"/>

<defs><pattern id="st" width="32" height="14" patternUnits="userSpaceOnUse">
<polygon points="0,14 14,0 30,0 16,14" fill="#e10600"/>
<animateTransform attributeName="patternTransform" type="translate" values="0 0;8 0;16 0;24 0" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
</pattern></defs>
<rect width="1200" height="14" fill="url(#st)"/>

</svg>
